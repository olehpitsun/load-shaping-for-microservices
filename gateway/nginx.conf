events {}

http {
    # Docker's embedded DNS resolver. Using a variable in proxy_pass
    # prevents Nginx from resolving classifier only once at startup.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8000;
        client_max_body_size 12m;

        set $classifier_backend http://classifier:8000;

        location / {
            proxy_pass $classifier_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
    }
}
