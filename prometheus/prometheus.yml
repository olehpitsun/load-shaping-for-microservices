global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "classifier"
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - classifier
        type: A
        port: 8000
        refresh_interval: 5s

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - cadvisor:8080
